[workspace]
members = [
    "crates/vfs-cli",
    "crates/vfs-core",
    "crates/vfs-fuse",
    "crates/vfs-nfs",
    "crates/vfs-mount",
]
resolver = "2"

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/Factory-AI/vfs"

# Concurrency canon (architecture.md section 7 item 7): no lock guard held
# across an .await; enforced structurally, not by review.
[workspace.lints.clippy]
await_holding_lock = "deny"
# nightly-2026-08-07 clippy fires double_must_use on code generated inside
# #[async_trait] expansions (a `#[must_use]` the macro adds to fns already
# returning a must-use type). Allow until clippy stops linting that
# expansion; hand-written double #[must_use] is not a pattern this workspace
# uses.
double_must_use = "allow"

[workspace.dependencies]
vfs-core = { path = "crates/vfs-core" }
vfs-cli = { path = "crates/vfs-cli" }
vfs-fuse = { path = "crates/vfs-fuse" }
vfs-mount = { path = "crates/vfs-mount" }
vfs-nfs = { path = "crates/vfs-nfs" }

anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
bytes = "1.12.1"
byteorder = "1.5"
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "=4.5.61", features = ["unstable-dynamic"] }
criterion = { version = "0.5", features = ["async_tokio"] }
dirs = "6"
filetime = "0.2"
futures-util = "0.3.33"
globset = "0.4"
hex = "0.4"
inotify = { version = "0.11", default-features = false }
libc = "0.2"
lru = "0.12"
memchr = "2.7"
nix = { version = "0.29", features = ["fs", "user"] }
num-derive = "0.4"
num-traits = "0.2"
object_store = { version = "0.14.1", features = ["aws"] }
page_size = "0.6"
parking_lot = "0.12.5"
proptest = "1.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.147"
sha1 = "0.10"
sha2 = "0.10"
smallvec = "1.6"
tempfile = "3.23.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turso = "0.5"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }
zerocopy = { version = "0.8", features = ["derive"] }

# Ensure transitive `aegis` (pulled in by `turso`) builds on macOS arm64 by
# forcing the `pure-rust` feature, which skips the C/NEON backend that fails
# with Apple clang (`veor3q_u8` in `aegis128l_neon_sha3.c`).
aegis = { version = "0.9.6", features = ["pure-rust"] }

[patch.crates-io]
turso = { path = "third_party/turso" }
turso_sdk_kit = { path = "third_party/turso_sdk_kit" }

# The profile that `dist` will build with.
[profile.dist]
inherits = "release"
lto = "thin"

[profile.bench]
debug = true
